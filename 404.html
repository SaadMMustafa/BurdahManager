<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الصفحة غير موجودة — موسوعة البُردة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Kufi Arabic', Tahoma, sans-serif;
      background: #fcfbf7;
      color: #18312b;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 500px; }
    h1 { font-size: 72px; color: #23624f; margin-bottom: 10px; }
    p { color: #6f7c76; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #23624f;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }
    a:hover { background: #1a4a3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>٤٠٤</h1>
    <p>عذرًا، الصفحة التي تبحث عنها غير موجودة.</p>
    <a href="/">العودة للرئيسية</a>
  </div>
</body>
</html>
